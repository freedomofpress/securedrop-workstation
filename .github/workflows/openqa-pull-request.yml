---
name: OpenQA
run-name: "[OpenQA] ${{ github.event.action == 'synchronize' && 'synchronize' || github.event.label.name }}"

on:
  pull_request:
    types:
      - labeled     # Trigger immediately when label added
      - unlabeled   # Detect label removal in order to cancel previous runs
      - synchronize # Re-run against new HEAD when commits are pushed to the PR

# Collapse rapid toggles of the same label into a single run of the job.
# Different labels (e.g. 4.3-openqa-admin vs 4.3-openqa-all)
# and synchronize events stay in separate groups, so they run independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name || github.event.action }}
  cancel-in-progress: true

jobs:
  check:
    name: 'Check OpenQA triggers'
    runs-on: ubuntu-latest
    outputs:
      qa-settings: ${{ steps.find_labels.outputs.qa-settings }}
    steps:
      - name: Find all openqa labels on this PR  # zizmor: ignore[template-injection]
        id: find_labels
        uses: actions/github-script@v9
        with:
          script: |
            let labels;

            switch (context.payload.action) {
              case 'synchronize':
                console.log('Code was pushed: checking all valid OpenQA-triggering labels');
                labels = context.payload.pull_request.labels;
                break;
              case 'labeled':
                // break; <- intentionally missed to group with 'unlabeled'
              case 'unlabeled':
                console.log('Specific label changed: OpenQA run only for changed label');
                labels = [context.payload.label];
                break;
              default:
                console.error(`Unhandled event action: ${context.payload.action}`);
                process.exit(1);
            }

            // Find all '<version>-openqa-<product>' labels
            const labelRegex = /^([0-9]+\.[0-9]+)-openqa-(admin|journalist|all)$/;
            const qaSettings = labels
              .map(label => label.name && label.name.match(labelRegex))
              .filter(match => match)
              .map(match => ({ qubes_version: match[1], securedrop_product: match[2] }));

            if (qaSettings.length === 0) {
              console.log('No valid *-openqa-* labels found');
              return;
            }

            console.log(`Found openqa tests settings: ${JSON.stringify(qaSettings)}`);
            core.setOutput('qa-settings', JSON.stringify(qaSettings));

  # Runs/Cancels OpenQA job for each (Qubes version, product) found in labels
  openqa:
    needs: [check]
    if: ${{ needs.check.outputs.qa-settings != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.qa-settings) }}
    uses: ./.github/workflows/openqa.yml
    secrets: inherit
    with:
      environment: "dev"
      git_ref: ${{ github.event.pull_request.head.sha }}
      qubes_ver: ${{ matrix.qubes_version }}
      securedrop_product: ${{ matrix.securedrop_product }}

      # NOTE: cancellation is done through concurrency: by starting another job
      # with the same conditions as the one we want to cancel, it necessarily
      # cancels the previous one. The trick is to trigger a no-op on the callee
      # (this is done through 'cancel=true'). This avoids the need for complex
      # "run-id"-tracking logic in order to cancel previous runs.
      cancel: ${{ github.event.action == 'unlabeled' }}
